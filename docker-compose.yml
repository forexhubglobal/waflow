version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: waflow
      POSTGRES_PASSWORD: waflowpassword
      POSTGRES_DB: waflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
